name: idcc-demobata
services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: idcc-demobata-web:local
    env_file:
      - path: ./.env
        required: false
      - path: ./.env.postgres
        required: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      IDCC_DEMO_MODE: "${IDCC_DEMO_MODE:-true}"
      IDCC_PG_HOST: postgres
      IDCC_PG_PORT: "5432"
      POSTGRES_USER: idcc
      APACHE_RUN_USER: "${IDCC_APACHE_USER:-www-data}"
      APACHE_RUN_GROUP: "${IDCC_APACHE_GROUP:-www-data}"
    ports:
      - "127.0.0.1:${IDCC_HTTP_PORT:-8080}:80"
    volumes:
      - type: bind
        source: .
        target: /var/www/html/DemoBeta
        bind:
          create_host_path: false
      - type: bind
        source: ./env
        target: /var/www/html/DemoBeta/env
        read_only: true
        bind:
          create_host_path: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
  data-exchange:
    profiles: [data-exchange]
    image: idcc-demobata-web:local
    build:
      context: .
      dockerfile: docker/Dockerfile
    entrypoint: ["bash", "/var/www/html/DemoBeta/DataExchange/scheduler.sh"]
    init: true
    env_file:
      - path: ./.env
        required: false
      - path: ./.env.postgres
        required: true
    environment:
      IDCC_PG_HOST: postgres
      IDCC_PG_PORT: "5432"
      POSTGRES_USER: idcc
      DATA_EXCHANGE_INTERVAL_SECONDS: "600"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - type: bind
        source: .
        target: /var/www/html/DemoBeta
        read_only: true
        bind:
          create_host_path: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      disable: true
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  postgres:
    image: postgres:17-bookworm
    ports:
      - "127.0.0.1:15432:5432"
    env_file:
      - ./.env.postgres
    environment:
      POSTGRES_USER: idcc
    volumes:
      - idcc_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U idcc -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
volumes:
  idcc_postgres_data:

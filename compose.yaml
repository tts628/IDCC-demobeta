name: idcc-demobata
services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: idcc-demobata-web:local
    env_file:
      - path: ./.env
        required: false
    environment:
      APACHE_RUN_USER: "${IDCC_APACHE_USER:-www-data}"
      APACHE_RUN_GROUP: "${IDCC_APACHE_GROUP:-www-data}"
    ports:
      - "127.0.0.1:${IDCC_HTTP_PORT:-8080}:80"
    volumes:
      - type: bind
        source: .
        target: /var/www/html/DemoBeta
        bind:
          create_host_path: false
      - type: bind
        source: ./env
        target: /var/www/html/DemoBeta/env
        read_only: true
        bind:
          create_host_path: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true

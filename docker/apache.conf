ServerName localhost
ServerTokens Prod
ServerSignature Off
DirectoryIndex index.php index.html

<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

<LocationMatch "(?i)(^|/)(\.git|\.env[^/]*|env|setup|docker|vendor)(/|$)">
    Require all denied
</LocationMatch>
<FilesMatch "(?i)(^\.|^Dockerfile$|^compose\.ya?ml$|\.(sh|ps1|psm1|cmd|bat|conf|ini|lock|log|sql|bak)$|^composer\.json$)">
    Require all denied
</FilesMatch>

# Only the container's own loopback health check can use this endpoint.
Alias /__idcc_health /opt/idcc/health.php
<Directory /opt/idcc>
    AllowOverride None
    Require local
</Directory>
